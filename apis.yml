name: Apropose
description: >-
  Apropose, Inc. was a Mountain View, California startup spun out of the Stanford
  University Computer Science Department in 2013 to bring data-driven software to
  web design. Founded by Ranjitha Kumar, Jerry Talton, Maxine Lim, and Arvind
  Satyanarayan, the company built tools for large-scale visual page search and
  web design analytics — letting teams track design trends, compare a site's
  design against demographics, and surface prevalent design patterns to inject
  concrete data into the design process. It raised a roughly $1.875M seed round in
  2014 led by New Enterprise Associates (NEA) and Andreessen Horowitz (a16z), with
  angels including Pat Hanrahan and Nick McKeown. The company has since ceased
  operations and is permanently closed; it publishes no public API, developer
  portal, or documentation, and its primary domain (apropose.com) is now parked
  and listed for sale. This profile is retained as an a16z portfolio-lead record.
